name: Stripe
entryKey: ablv-stripe
serverUserType: singleUser
shortDescription: Process payments, manage subscriptions, invoices, customers, and disputes with Stripe
description: |
  Manage Stripe customers, products, payments, subscriptions, invoices, disputes, and other commerce workflows through [Stripe's MCP server](https://docs.stripe.com/mcp).

  ## Features
  - **Customer Management**: Create, list, and manage customers with comprehensive data handling
  - **Product & Pricing**: Create products and flexible pricing models including one-time and recurring billing
  - **Payment Processing**: Handle payment intents, refunds, and payment links for seamless transactions
  - **Subscription Billing**: Full subscription lifecycle management with updates, cancellations, and modifications
  - **Invoice System**: Create, manage, finalize, and track invoices with line items
  - **Dispute Resolution**: List and respond to disputes with evidence submission
  - **Coupon Management**: Create and manage discount coupons with flexible terms
  - **Search & Discovery**: Advanced search across all Stripe resources with custom query syntax
  - **Account Operations**: Access account information and balance details

  ## What you'll need to connect

  Stripe supports two authentication methods. Pick one per deployment.

  **OAuth 2.0 (recommended):** Use OAuth when a client accesses Stripe on behalf of your Stripe user account. Connecting opens Stripe's OAuth consent page, where you grant access to one or more live mode accounts or sandboxes and set permissions separately for each environment. No manually supplied API key or token is required, and Stripe's authorization server supports Dynamic Client Registration with PKCE and `S256`. Authorized clients appear under **OAuth sessions** in your Stripe user settings, where you can revoke access.

  **Agent API key:** Use an agent API key when an application needs independent, persistent access, such as an autonomous client that cannot complete the OAuth flow. Create a key with only the permissions the client needs and pass it as the bearer token in the `Authorization` header. Agent API keys are identifiable in the Stripe Dashboard by an **Agent** badge.

  > **Key policy change on 31 October 2026:** From 31 October 2026, Stripe MCP no longer accepts full-access secret keys, or restricted API keys without the Agent tag. Replace any such key with a newly created Agent API key, or reconnect using OAuth, before that date. Requests using an unsupported key receive a `401` response with an OAuth discovery challenge. When replacing a key, test the new configuration in a sandbox before expiring the old one.

  **Administrators:** MCP access can be enabled or disabled for an entire team from the Stripe Dashboard, configured separately for live mode and sandbox environments. On a managed device or network, your IT administrator may also need to allow connections to `mcp.stripe.com`.

metadata:
  categories: SaaS & API Integrations,Payments,Billing
  # vendorIdentity is omitted pending verification of a user-identity source.
  # get_stripe_account_info returns account information, not a verified
  # signed-in user identity. Both mechanisms use requiresVendorIdentity: false.
  authMechanisms: |
    [
      {
        "value": "oauth",
        "label": "OAuth 2.0",
        "description": "Sign in with Stripe and grant access to the accounts and environments this connection may use.",
        "requiresVendorIdentity": false
      },
      {
        "value": "agent_api_key",
        "label": "Agent API Key",
        "description": "Use a Stripe Agent API key for persistent, non-interactive access (no per-user vendor OAuth).",
        "requiresVendorIdentity": false,
        "headers": [
          {
            "name": "Stripe Agent API Key",
            "key": "Authorization",
            "required": true,
            "sensitive": true,
            "prefix": "Bearer ",
            "description": "Stripe Agent API key scoped to the permissions this deployment needs; full-access secret keys and non-Agent restricted keys stop working on 31 October 2026"
          }
        ]
      }
    ]
icon: https://avatars.githubusercontent.com/u/856813?s=200&v=4
repoURL: https://docs.stripe.com/mcp
toolPreview:
  # API tools
  - name: stripe_api_search
    description: Search for Stripe API methods by keyword.
    params:
      keyword: Keyword used to find matching Stripe API methods

  - name: stripe_api_details
    description: Get detailed parameter information for a specific Stripe API method.
    params: {}

  - name: stripe_api_read
    description: Read data with any supported Stripe API GET method.
    params: {}

  - name: stripe_api_write
    description: Write data with any supported Stripe API POST, PATCH, PUT, or DELETE method. Some writes, such as refunds and outbound payments, require human confirmation before Stripe runs them.
    params: {}

  # Account
  - name: get_stripe_account_info
    description: Retrieve the connected Stripe account.
    params: {}

  # Analytics
  - name: stripe_analytics
    description: Query metrics, analyze subscriptions and billing, and run financial reports (preview). With Sigma, builds SQL queries from natural language.
    params: {}

  # Treasury (public preview)
  - name: get_balance_summary
    description: Display an interactive balance summary across the Stripe balance and Treasury accounts.
    params: {}

  # Documentation, planning, and feedback
  - name: search_stripe_documentation
    description: Search the Stripe documentation for the given question and language.
    params:
      question: The question to answer from the Stripe documentation
      language: Programming language context for the answer

  - name: stripe_implementation_planner
    description: Guides you through Stripe products to accept payments, sell products online, set up billing, or build any Stripe integration.
    params: {}

  - name: send_stripe_feedback
    description: Share feedback about Stripe's products.
    params: {}
runtime: remote
remoteConfig:
  fixedURL: https://mcp.stripe.com
  headers:
    - name: Stripe Agent API Key
      key: Authorization
      required: false
      sensitive: true
      prefix: "Bearer "
      description: Stripe Agent API key for non-OAuth connections; leave empty when using OAuth
