name: Databricks Genie Spaces
entryKey: ablv-databricks-genie-spaces
serverUserType: singleUser
shortDescription: Ask natural language questions about your data with AI-powered analytics
description: |
  Ask natural-language questions and analyze data in Genie Spaces through [Databricks managed MCP servers](https://docs.databricks.com/aws/en/generative-ai/mcp/), with built-in Unity Catalog security.

  ## Features
  - **Natural Language Analytics**: Ask questions about your data in plain English
  - **Data Insights**: Get automated insights and trend analysis from your Genie spaces
  - **Conversational BI**: Interactive business intelligence through natural language
  - **Serverless SQL**: Leverage serverless SQL compute for query execution

  ## What you'll need to connect

  ### Prerequisites
  - **For admins**: Ensure the workspace has the **Managed MCP Servers** preview enabled. See [Databricks documentation](https://docs.databricks.com/en/admin/workspace-settings/manage-previews.html) for your cloud provider.
  - **For users**: Ensure your account has access to Genie spaces in your workspace.

  ### Setup Steps
  1. Navigate to your Databricks workspace
  2. Go to **Genie** → Create or select an existing Genie space
  3. Note the Genie space ID from the URL or space settings
  4. Create a Personal Access Token in **Settings** → **Developer** → **Access tokens**
  5. Configure the environment variables with your specific values


metadata:
  categories: Data Analytics, Business Intelligence
  # vendorIdentity is intentionally omitted. Databricks exposes no current-user
  # MCP tool. The documented REST fallback (GET /api/2.0/preview/scim/v2/Me,
  # which accepts any scoped token and returns id and userName) lives on the
  # per-workspace host, so a probe would need ${DATABRICKS_WORKSPACE_URL}
  # expanded in its URL. Add vendorIdentity only after that is verified.
  #
  # authMechanisms declares vendor auth options shown at launch. Each deployment
  # instance picks one; filter-selector routes by metadata.auth_mechanism.
  # Databricks MCP endpoints do not support dynamic client registration, so
  # OAuth requires an account-admin-registered OAuth app (App connections).
  authMechanisms: |
    [
      {
        "value": "oauth",
        "label": "OAuth 2.0",
        "description": "Sign in with Databricks using an OAuth app registered by an account admin; request the genie and offline_access scopes.",
        "requiresVendorIdentity": false
      },
      {
        "value": "pat",
        "label": "Personal Access Token",
        "description": "Use a Databricks PAT for a user or service principal (no per-user vendor OAuth).",
        "requiresVendorIdentity": false,
        "headers": [
          {
            "name": "Personal Access Token",
            "key": "Authorization",
            "required": true,
            "sensitive": true,
            "prefix": "Bearer ",
            "description": "Databricks PAT with access to the Genie space"
          }
        ]
      }
    ]
icon: https://avatars.githubusercontent.com/u/4998052?s=200&v=4
repoURL: https://docs.databricks.com/aws/en/generative-ai/mcp/

env:
  - name: Databricks workspace hostname
    key: DATABRICKS_WORKSPACE_URL
    description: Databricks workspace hostname, (e.g., https://your-workspace.cloud.databricks.com)
    required: true
    sensitive: false
  - name: Genie space ID
    key: DATABRICKS_GENIE_SPACE_ID
    description: Your Databricks Genie space ID
    required: true
    sensitive: false

runtime: remote
remoteConfig:
  urlTemplate: ${DATABRICKS_WORKSPACE_URL}/api/2.0/mcp/genie/${DATABRICKS_GENIE_SPACE_ID}
  staticOAuthRequired: true
  headers:
  - name: Personal Access Token
    description: Optional. Databricks PAT for PAT auth; leave empty when using OAuth.
    key: Authorization
    required: false
    sensitive: true
    prefix: "Bearer "
