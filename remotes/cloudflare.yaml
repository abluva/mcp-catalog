name: Cloudflare
entryKey: ablv-cloudflare
serverUserType: singleUser
shortDescription: Search and manage the full Cloudflare API through Cloudflare's Code Mode MCP server
upgradeNote: |
  This entry now connects to Cloudflare's consolidated API MCP server instead of letting you choose a product-specific `*.mcp.cloudflare.com` server.

  - **Reconnect required:** Choose one of two authentication methods — Cloudflare OAuth, or a scoped Cloudflare user or account API token. The previous custom server URL is not carried over and must be replaced.
  - **Tool changes:** Product-specific native tools are replaced by the `docs`, `search`, `execute`, and `whoami` tools. Existing tool names and parameters will change.
  - **Specialized workflows:** Cloudflare's product-specific MCP servers remain available for targeted workflows, but are no longer selectable through this catalog entry.
description: |
  Cloudflare's official, vendor-hosted API MCP server gives agents access to the full Cloudflare API without loading thousands of endpoint schemas into the model context. It searches Cloudflare documentation and the OpenAPI specification, then runs model-written JavaScript in an isolated Worker to make authorized Cloudflare API requests.

  See the [Cloudflare API MCP repository](https://github.com/cloudflare/mcp) and [Cloudflare's MCP server documentation](https://developers.cloudflare.com/agents/model-context-protocol/cloudflare/servers-for-cloudflare/) for current setup instructions and capabilities.

  ## Features
  - **Broad API coverage**: Work with more than 2,500 Cloudflare API endpoints across Workers, KV, R2, D1, Pages, DNS, security, networking, AI, observability, and other products.
  - **Documentation search**: Search current Cloudflare developer documentation before choosing an operation.
  - **Progressive discovery**: Search the Cloudflare OpenAPI specification on demand instead of placing every endpoint schema in the model context.
  - **Code Mode execution**: Compose requests, filtering, branching, and result shaping in sandboxed JavaScript through a compact tool surface.
  - **GraphQL analytics**: Send Cloudflare GraphQL Analytics API queries through the same execution tool.

  ## What you'll need to connect

  Cloudflare supports two authentication methods. Pick one per deployment.

  **OAuth 2.0 (recommended):** Connect to the server and you are redirected to Cloudflare to authorize and select permissions. No manually supplied API key or token is required. Cloudflare's authorization server supports Dynamic Client Registration and uses the authorization code flow with PKCE and `S256`. The consent screen offers read-only and full-access scope templates, and an advanced section where you can narrow the requested scope list.

  **API token:** For CI/CD, automation, or headless use, provide a Cloudflare API token as a bearer token. Both user tokens and account tokens are supported. Create one with only the permissions your tasks require. An account token additionally needs `Account Resources: Read` so the server can auto-detect the account ID. Note that an account token represents the Cloudflare account rather than an individual user.

  ## Important considerations
  - Code Mode is experimental and may introduce breaking changes. The server executes model-written JavaScript in an isolated Worker; API access is restricted to the permissions granted by your OAuth connection or API token.
  - This upgrade preserves broad API and documentation access, but product-specific servers may offer higher-level, curated workflows that are not equivalent to raw API operations.
  - API tokens with Client IP Address Filtering are not currently supported.

  > **⚠️ Upgrade notice**
  >
  > If you're upgrading this server, note that this entry now connects to Cloudflare's consolidated API MCP server instead of letting you choose a product-specific `*.mcp.cloudflare.com` server.
  >
  > - **Reconnect required:** Choose one of two authentication methods — Cloudflare OAuth, or a scoped Cloudflare user or account API token. The previous custom server URL is not carried over and must be replaced.
  > - **Tool changes:** Product-specific native tools are replaced by the `docs`, `search`, `execute`, and `whoami` tools. Existing tool names and parameters will change.
  > - **Specialized workflows:** Cloudflare's product-specific MCP servers remain available for targeted workflows, but are no longer selectable through this catalog entry.

metadata:
  categories: Cloud & Infrastructure, SaaS & API Integrations
  # vendorIdentity tells Obot which MCP tool returns the logged-in vendor user.
  # See atlassian.yaml for the full field reference. Omit this block (or set
  # enforce: false) to disable identity verification.
  #
  # Cloudflare documents `whoami` as taking no arguments and returning
  # { id, email } for a user credential or { id, name } for an account token,
  # where id is `user:<id>` or `account:<id>`. Cloudflare states that ID format
  # is a permanent contract that is stable across token refresh, reconnection,
  # and permission changes, which makes it a safe accountId. `whoami` is
  # registered in both Code Mode and non-Code-Mode, so it is available
  # regardless of the ?codemode query parameter.
  #
  # display maps to email rather than name because a user credential returns no
  # name field; name is returned only for account tokens, which the api_token
  # mechanism covers and which declares requiresVendorIdentity: false.
  vendorIdentity: |
    {
      "provider": "cloudflare",
      "enforce": true,
      "onMismatch": "block",
      "tool": "whoami",
      "args": {},
      "fields": {
        "accountId": "id",
        "login": "email",
        "display": "email"
      }
    }
  # authMechanisms declares vendor auth options shown at launch. Each deployment
  # instance picks one; filter-selector routes by metadata.auth_mechanism.
  authMechanisms: |
    [
      {
        "value": "oauth",
        "label": "OAuth 2.0",
        "description": "Sign in with Cloudflare; vendor identity is verified per assignment in Projects.",
        "requiresVendorIdentity": true
      },
      {
        "value": "api_token",
        "label": "API Token",
        "description": "Use a scoped Cloudflare user or account API token for this deployment (no per-user vendor OAuth).",
        "requiresVendorIdentity": false,
        "headers": [
          {
            "name": "Cloudflare API Token",
            "key": "Authorization",
            "required": true,
            "sensitive": true,
            "prefix": "Bearer ",
            "description": "Scoped Cloudflare user or account API token; account tokens also need Account Resources: Read"
          }
        ]
      }
    ]
icon: https://avatars.githubusercontent.com/u/314135?s=48&v=4
repoURL: https://github.com/cloudflare/mcp
runtime: remote
remoteConfig:
  fixedURL: https://mcp.cloudflare.com/mcp
  headers:
  - name: Cloudflare API Token
    description: Optional scoped Cloudflare user or account API token for non-OAuth connections
    key: Authorization
    required: false
    sensitive: true
    prefix: "Bearer "
toolPreview:
- name: docs
  description: Search Cloudflare developer documentation for products and features.
  params:
    query: Cloudflare documentation search query
- name: search
  description: Run sandboxed JavaScript against the Cloudflare OpenAPI specification to discover API operations.
  params:
    code: JavaScript async arrow function that searches the OpenAPI specification
- name: execute
  description: Run sandboxed JavaScript that makes authorized requests to the Cloudflare API.
  params:
    code: JavaScript async arrow function that executes Cloudflare API requests
    account_id: Optional account ID for user tokens or OAuth connections with access to multiple accounts
- name: whoami
  description: Return the Cloudflare user or account this connection is authenticated as, as a stable `user:<id>` or `account:<id>` identifier.
  params: {}
