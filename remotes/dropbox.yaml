name: Dropbox
entryKey: ablv-dropbox
serverUserType: singleUser
shortDescription: Search, organize, create, and share Dropbox files and folders
description: |
  Search, organize, create, and share Dropbox files and folders through [Dropbox's remote MCP server](https://help.dropbox.com/integrations/connect-dropbox-mcp-server), which respects existing permissions.

  ## Features
  - Search, browse, preview, and download files
  - Create, copy, move, and delete files and folders
  - Create and inspect shared links
  - Create and manage file requests

  ## What you'll need to connect

  **Required:**
  - **Dropbox Account**: Each user authenticates through OAuth and can access files allowed by their Dropbox permissions

  **OAuth client registration**: Dropbox supports Dynamic Client Registration (DCR) only for the MCP clients it lists as supported (ChatGPT Codex, ChatGPT Web, Claude Code, Claude Web/Desktop, and Cursor). Any other client requires a Dropbox app registered in the Dropbox App Console, with a configured OAuth 2 redirect URI and the app key and app secret from that app. DCR and pre-registered apps are two registration approaches within OAuth 2.0, not separate authentication mechanisms.

